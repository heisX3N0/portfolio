# CI for every PR (SPEC 9.4): install, type check, build, tests and internal links, external links, Lighthouse.
# The figures check joins in P4.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Cap a stuck run: Actions minutes are a shared free quota while the repo is private.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the footer's "Last updated" reads the last commit date

      - name: Enable corepack (pnpm from package.json)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Tests and internal link check
        run: pnpm test

      - name: External link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml "dist/**/*.html"
          fail: true

      - name: Lighthouse (95 in every category)
        run: pnpm lhci

      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: lighthouse-reports
          retention-days: 7
