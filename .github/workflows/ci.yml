# CI for every PR (SPEC 9.4): install, type check, build, tests (the figures check, internal links, SEO and security
# header checks, and the headless Chrome layout and CSP checks), external links, Lighthouse.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Cap a stuck run (the repo is public, so minutes are not counted, but a hung run still blocks the PR).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the footer's "Last updated" reads the last commit date

      # Installs the pnpm version pinned in package.json "packageManager"; must come before setup-node's pnpm cache.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Tests, figures check and internal link check
        run: pnpm test

      - name: External link check
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir turns root-relative links into file:// URLs, which lychee.toml excludes (pnpm test checks them).
          args: --config lychee.toml --root-dir "${{ github.workspace }}/dist" "dist/**/*.html"
          fail: true

      - name: Lighthouse (95 in every category)
        run: pnpm lhci

      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: lighthouse-reports
          retention-days: 7
